services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: analytics
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d analytics"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6379:6379"]
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/analytics
      REDIS_URL: redis://redis:6379/0
      PORT: "5050"
    ports: ["127.0.0.1:5050:5050"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  frontend:
    build: ./frontend
    ports: ["127.0.0.1:8080:80"]
    depends_on: [backend]

  wikipedia:
    build: ./connectors
    environment:
      WIKI_STREAM_URL: ${WIKI_STREAM_URL:-https://stream.wikimedia.org/v2/stream/recentchange}
      WIKI_USER_AGENT: ${WIKI_USER_AGENT:-RealTimeAnalyticsDashboard/0.1 (learning project; Python aiohttp)}
    volumes: ["wiki_state:/state"]
    depends_on: [backend]
    restart: unless-stopped
    stop_grace_period: 15s

volumes:
  pgdata:
  wiki_state:
