# Replace the host and TLS Secret before deployment; an ingress-nginx controller is required.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: analytics
  namespace: analytics
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [analytics.example.invalid]
      secretName: analytics-tls
  rules:
    - host: analytics.example.invalid
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service: { name: backend, port: { number: 5050 } }
          - path: /ws
            pathType: Prefix
            backend:
              service: { name: backend, port: { number: 5050 } }
          - path: /rta.js
            pathType: Exact
            backend:
              service: { name: backend, port: { number: 5050 } }
          - path: /
            pathType: Prefix
            backend:
              service: { name: frontend, port: { number: 80 } }
